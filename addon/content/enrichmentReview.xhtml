<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  title="Review metadata — CUNY AI Lab"
  width="760"
  height="620"
  onload="window.arguments[0].onLoad(window);"
>
  <html:main style="padding: 20px; overflow: auto">
    <html:h1>Review metadata</html:h1>
    <html:p
      >A CUNY AI Lab tool. Check the edition and source before saving. Each save
      creates a history note; use Tools → Undo Metadata Changes to review an
      undo.</html:p
    >
    <html:p
      >Undo only offers fields that still match the saved values, protecting
      your later edits.</html:p
    >
    <html:div id="review-rows" />
    <html:p id="review-status" role="status" aria-live="polite" />
    <html:button onclick="window.close();">Close</html:button>
  </html:main>
</window>
