<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window });"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <!-- API Key -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-apikey"
      data-l10n-id="pref-api-key-label"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-apikey"
      preference="openrouterApiKey"
      style="width: 300px;"
    ></html:input>
  </hbox>
  <description data-l10n-id="pref-api-key-description" style="margin-left: 20px; color: gray;"></description>

  <!-- Auto-enrich on import -->
  <checkbox
    id="zotero-prefpane-__addonRef__-autoenrich"
    preference="autoEnrichOnImport"
    data-l10n-id="pref-auto-enrich-label"
  />

  <!-- Search OCLC/LCCN for pre-1970 books -->
  <checkbox
    id="zotero-prefpane-__addonRef__-enrichpreisbn"
    preference="enrichPreIsbn"
    data-l10n-id="pref-enrich-preisbn-label"
  />

  <!-- LLM Model -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-llmmodel"
      data-l10n-id="pref-llm-model-label"
    ></html:label>
    <menulist id="zotero-prefpane-__addonRef__-llmmodel" preference="llmModel" style="width: 250px;">
      <menupopup>
        <menuitem label="GPT-4o Mini (Recommended)" value="openai/gpt-4o-mini" />
        <menuitem label="GPT-4o" value="openai/gpt-4o" />
        <menuitem label="Claude Sonnet 4.5" value="anthropic/claude-sonnet-4.5" />
        <menuitem label="Gemini 2.5 Flash" value="google/gemini-2.5-flash" />
      </menupopup>
    </menulist>
  </hbox>

  <!-- API Delay -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-apidelay"
      data-l10n-id="pref-api-delay-label"
    ></html:label>
    <html:input
      type="number"
      id="zotero-prefpane-__addonRef__-apidelay"
      preference="apiDelayMs"
      min="100"
      max="2000"
      style="width: 80px;"
    ></html:input>
  </hbox>

</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"name": "__addonName__","version":"__buildVersion__"}'
    style="color: gray; font-size: 11px;"
  ></html:label>
</vbox>
